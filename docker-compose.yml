services:
  backend:
    image: ghcr.io/cbomkit/cbomkit:${CBOMKIT_VERSION}
    depends_on:
      db:
        condition: service_healthy
    environment:
      CBOMKIT_DB_TYPE: postgresql
      CBOMKIT_DB_JDBC_URL: jdbc:postgresql://db:5432/postgres
      CBOMKIT_PORT: 8081
      CBOMKIT_DB_USERNAME: ${POSTGRESQL_AUTH_USERNAME}
      CBOMKIT_DB_PASSWORD: ${POSTGRESQL_AUTH_PASSWORD}
      CBOMKIT_FRONTEND_URL_CORS: ${CBOMKIT_FRONTEND_URL_CORS:-http://localhost:8000}
      CBOMKIT_OPA_API_BASE: "http://opa-local:8181"
    ports:
      - "8081:8081"
    volumes:
      - cbomkit-volume:/home/user/.cbomkit
    restart: always
    deploy:
      resources:
        reservations:
          memory: 16g
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./cbomkit-site-html:/usr/share/nginx/html:ro
    restart: always
  db:
    image: docker.io/library/postgres:16-alpine
    user: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRESQL_AUTH_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_AUTH_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_AUTH_USERNAME} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - "pg-volume:/var/lib/postgresql/data/"
    restart: always
  opa-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - opa-local
    ports:
      - "8182:80"
    environment:
      CBOMKIT_FRONTEND_URL_CORS: ${CBOMKIT_FRONTEND_URL_CORS:-http://localhost:8000}
    volumes:
      - ./nginx/opa-proxy.conf:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped
  opa-local:
    image: docker.io/openpolicyagent/opa:1.15.1
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      - ./policies/eccg:/policies:ro
    restart: unless-stopped
  semgrep-local:
    build:
      context: ./semgrep-server
      dockerfile: Dockerfile
    environment:
      SEMGREP_CONFIGS_DIR: /configs
      SEMGREP_SERVER_PORT: 9091
      SEMGREP_TIMEOUT_SECONDS: 600
      LOG_LEVEL: INFO
    ports:
      - "9091:9091"
    volumes:
      - "./configs:/configs:ro"
    restart: unless-stopped
volumes:
  cbomkit-volume:
  pg-volume:
