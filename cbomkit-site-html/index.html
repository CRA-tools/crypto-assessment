<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRACY Cryptographic Assessment Tool</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js?v=3"></script>
  </head>

  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <h1>CRACY Cryptographic Assessment Tool</h1>

        <div class="topbar__actions">
          <a
            class="github-link"
            href="https://github.com/CRA-tools/crypto-assessment"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View project on GitHub (opens in a new tab)"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="M12 .75a11.25 11.25 0 0 0-3.558 21.923c.563.104.768-.244.768-.543 0-.267-.01-.975-.015-1.914-3.13.68-3.79-1.508-3.79-1.508-.512-1.3-1.25-1.646-1.25-1.646-1.022-.699.078-.685.078-.685 1.13.08 1.725 1.16 1.725 1.16 1.005 1.723 2.637 1.225 3.28.937.103-.728.393-1.225.715-1.507-2.5-.284-5.128-1.25-5.128-5.566 0-1.23.44-2.234 1.16-3.022-.116-.285-.503-1.43.11-2.98 0 0 .945-.303 3.094 1.154A10.79 10.79 0 0 1 12 6.174c.956.005 1.918.13 2.817.379 2.148-1.457 3.091-1.154 3.091-1.154.615 1.55.228 2.695.112 2.98.722.788 1.159 1.792 1.159 3.022 0 4.327-2.633 5.279-5.14 5.558.404.35.766 1.042.766 2.1 0 1.517-.014 2.74-.014 3.111 0 .302.203.653.774.542A11.25 11.25 0 0 0 12 .75Z" />
            </svg>
            <span>GitHub</span>
          </a>
          <label class="theme-toggle" title="Toggle dark mode">
            <input id="darkModeToggle" type="checkbox" />
            <span>Dark</span>
          </label>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <section class="intro-card">
        <h2>Repository details</h2>
      </section>

      <section class="checker-card" aria-labelledby="checker-title">
        <form id="complianceForm" class="form">
          <label class="field">
            <span>Git repository URL (e.g., https://github.com/CRA-tools/crypto-assessment)</span>
            <input
              id="repoUrl"
              name="repoUrl"
              type="url"
              placeholder="https://github.com/org/repo"
              autocomplete="url"
              required
            />
          </label>

          <div class="field-grid">
            <label class="field">
              <span>Scan path - Optional (e.g., demo/code )</span>
              <input
                id="scanPath"
                name="scanPath"
                type="text"
                placeholder="Optional, e.g. src"
              />
            </label>

            <label class="field">
              <span>Branch - Optional</span>
              <input
                id="branch"
                name="branch"
                type="text"
                placeholder="Optional, e.g. main"
              />
            </label>
          </div>

          <div class="field-grid">
            <label class="field">
              <span>Commit - Optional</span>
              <input
                id="commit"
                name="commit"
                type="text"
                placeholder="Optional exact commit SHA"
              />
            </label>

            <label class="field">
              <span>PAT - Optional</span>
              <input
                id="pat"
                name="pat"
                type="password"
                placeholder="Optional token"
                autocomplete="off"
              />
            </label>
          </div>

          <div class="action-row">
            <button id="checkButton" class="primary-button" type="submit">
              Assess
            </button>
          </div>
        </form>

        <div id="status" class="status" role="status">Status: Ready</div>
        <div id="errorBox" class="error-box" hidden></div>
      </section>

      <section id="results" class="results" hidden>
        <h2>Assessment result</h2>

        <div id="complianceBanner"></div>
        <div id="summary" class="summary"></div>

        <div class="result-action-row">
          <button
            id="downloadCbomButton"
            class="secondary-button"
            type="button"
            hidden
            disabled
            style="display: none"
          >
            Download generated CBOM
          </button>
        
          <button id="toggleFindingsButton" class="secondary-button" type="button">
            Show findings
          </button>
        </div>

        <div id="findingsContainer" class="findings-container" hidden>
          <div id="regoResults"></div>
          <div id="semgrepResults"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <div class="footer__logos" aria-label="Project logos">
          <a
            href="https://excid.io/"
            target="_blank"
            rel="noopener noreferrer"
            class="footer__logo-link"
            aria-label="ExcID"
          >
            <img src="img/excid-logo.svg" alt="ExcID logo" />
          </a>

          <img src="img/eu-cofunded-logo.png" alt="Co-funded by the European Union" />

          <img src="img/eccc-logo.svg" alt="ECCC logo" />

          <a
            href="https://cra-cy.eu/"
            target="_blank"
            rel="noopener noreferrer"
            class="footer__logo-link"
            aria-label="CRACY"
          >
            <img src="img/cracy.png" alt="CRACY logo" />
          </a>
        </div>

        <p>
          © 2026 CRACY — This project has received funding from the European
          Union's Digital Europe Programme under grant agreement No 101190492.
        </p>
      </div>
    </footer>
  </body>
</html>
